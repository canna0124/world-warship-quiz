<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>世界の軍艦クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section id="home" class="screen active">
      <div class="hero">
        <div class="eyebrow">WWI → MODERN</div>
        <h1>世界の軍艦クイズ</h1>
        <p>戦艦・巡洋戦艦・現代の大型水上戦闘艦を写真で当てよう！</p>
      </div>

      <div class="panel settings">
        <label>
          出題数
          <select id="questionCount">
            <option value="10" selected>10問</option>
            <option value="20">20問</option>
            <option value="999">エンドレス</option>
          </select>
        </label>

        <label>
          年代
          <select id="eraFilter">
            <option value="all" selected>すべて</option>
            <option value="historic">第一次世界大戦〜第二次世界大戦</option>
            <option value="modern">冷戦後〜現代</option>
          </select>
        </label>

        <label>
          国
          <select id="countryFilter">
            <option value="all" selected>すべての国</option>
          </select>
        </label>

        <button id="startBtn" class="primary">クイズ開始</button>
      </div>

      <div class="note">
        写真はWikipedia/Wikimediaの公開画像をオンライン取得します。出題は未出題の艦を優先し、同じ艦が何度も続かないようにしています。
      </div>
    </section>

    <section id="quiz" class="screen">
      <header class="topbar">
        <button id="quitBtn" class="ghost">← 終了</button>
        <div id="progress">1 / 10</div>
        <div id="score">正解 0</div>
      </header>

      <div class="image-card">
        <div id="loading" class="loading">画像を読み込み中…</div>
        <img id="shipImage" alt="出題される軍艦の写真">
        <div id="imageFallback" class="fallback">画像を取得できませんでした</div>
        <a id="sourceLink" target="_blank" rel="noopener">画像・出典</a>
      </div>

      <div class="question-box">
        <div class="question-kicker">この艦は何でしょう？</div>
        <div id="choices" class="choices"></div>
      </div>

      <div id="feedback" class="feedback hidden">
        <div id="feedbackMark" class="feedback-mark"></div>
        <h2 id="answerName"></h2>
        <div id="answerMeta" class="meta"></div>
        <p id="answerDesc"></p>
        <button id="nextBtn" class="primary">次の問題へ</button>
      </div>
    </section>

    <section id="result" class="screen">
      <div class="result-card">
        <div class="eyebrow">RESULT</div>
        <h1>クイズ結果</h1>
        <div id="resultScore" class="big-score">0 / 10</div>
        <div id="resultRate" class="rate">正答率 0%</div>
        <p id="resultMessage"></p>
        <div class="result-actions">
          <button id="retryBtn" class="primary">もう一度</button>
          <button id="homeBtn" class="ghost dark">タイトルへ</button>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
